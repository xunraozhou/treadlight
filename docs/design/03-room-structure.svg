   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="31.68" y="183.312" transform="rotate(-0 31.68 183.312)">先理解一次完整修复：起跳造路 → 落拍固定</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #173d45" x="31.68" y="210.672" transform="rotate(-0 31.68 210.672)">02  让光留下</text>
  </g>
  <g id="text_21">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: end; fill: #61777d" x="541.44" y="210.672" transform="rotate(-0 541.44 210.672)">1 座桥 · 2 处激光 · 3000 px</text>
  </g>
  <g id="text_22">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="31.68" y="314.64" transform="rotate(-0 31.68 314.64)">在修复之外，加入对预警和安全间歇的判断</text>
  </g>
  <g id="text_23">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #173d45" x="31.68" y="342" transform="rotate(-0 31.68 342)">03  接续回响</text>
  </g>
  <g id="text_24">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: end; fill: #61777d" x="541.44" y="342" transform="rotate(-0 541.44 342)">2 座桥 · 2 处激光 · 3400 px</text>
  </g>
  <g id="text_25">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="31.68" y="445.968" transform="rotate(-0 31.68 445.968)">连续修复两座桥，全部共鸣完成后抵达终点</text>
  </g>
  <g id="text_26">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="31.68" y="481.536" transform="rotate(-0 31.68 481.536)">横向位置按工程坐标排列，纵向高度经压缩以突出道路关系。</text>
  </g>
  <g id="text_27">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="31.68" y="506.16" transform="rotate(-0 31.68 506.16)">深色线为固定平台；青色为待修复光桥；红色标记激光位置。</text>
  </g>
  <g id="text_28">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="31.68" y="528.048" transform="rotate(-0 31.68 528.048)">每座光桥宽 200 px；终点必须在本房间全部光桥固定后才能通过。</text>
  </g>
