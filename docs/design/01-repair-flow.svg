   <g id="text_1">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #173d45" x="211.126154" y="76.829869" transform="rotate(-0 211.126154 76.829869)">安全平台观察 → 真正从地面起跳</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(155.126154 160.106019)">判定有效，且满足</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(155.126154 178.694519)">目标桥空间条件？</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #2b9b91" x="229.203692" y="216.872269" transform="rotate(-0 229.203692 216.872269)">是</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(134.126154 255.050019)">青桥激活，记住本次目标</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(134.126154 273.638519)">从激活时刻开始计时四拍</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(148.126154 354.741219)">桥仍有效，实际落在</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(134.126154 373.329719)">同一桥面，且落拍有效？</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #2b9b91" x="229.203692" y="417.678829" transform="rotate(-0 229.203692 417.678829)">是</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(118.676935 461.553219)">固定金桥，首次修复 +120 分</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(136.395685 480.141719)">本轮保留，共鸣进度 +1</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #173d45" x="211.126154" y="556.297069" transform="rotate(-0 211.126154 556.297069)">全部光桥固定后，出口开启</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #173d45" x="374.355692" y="151.360909" transform="rotate(-0 374.355692 151.360909)">否</text>
   </g>
