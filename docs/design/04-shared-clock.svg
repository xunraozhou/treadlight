    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(106.202562 83.013633)">开始 / 重试</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(64.336 101.602133)">播放配乐并记录系统起点</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(404.1584 83.013633)">输出补偿</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(352.823244 101.602133)">混音等待 + 音频输出延迟</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(247.44 174.114322)">统一时间进度</text>
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(170.7725 192.702822)">系统时间差 − 输出延迟 → 换算成节拍</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(56.7872 280.045357)">动作判定</text>
