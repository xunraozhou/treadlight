   <g id="text_8">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #173d45" x="84.7872" y="364.338779" transform="rotate(-0 84.7872 364.338779)">手动判定校准</text>
   </g>
   <g id="text_9">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #173d45" x="356.76" y="364.338779" transform="rotate(-0 356.76 364.338779)">暂停冻结同一进度；继续时接续播放</text>
   </g>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 18px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #173d45" x="28.8" y="28.21275" transform="rotate(-0 28.8 28.21275)">让声音、判定与机关使用同一时间参照</text>
  </g>
  <g id="text_11">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="28.8" y="430.848" transform="rotate(-0 28.8 430.848)">校准值只修正动作判定，不改变跳跃轨迹、桥寿命或激光周期。</text>
  </g>
  <g id="text_12">
   <text style="font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #61777d" x="28.8" y="449.28" transform="rotate(-0 28.8 449.28)">重开房间会重新建立起点，并重置机关、计分与共鸣。</text>
