   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(193.04288 280.045357)">光桥状态</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(193.04288 298.633857)">持续四拍</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(329.83712 280.045357)">激光阶段</text>
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(329.83712 298.633857)">八拍周期</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'Microsoft YaHei'; fill: #173d45" transform="translate(466.0928 280.045357)">视觉提示</text>
