name: Presentation checks

on:
  push:
    branches: [main]
    paths:
      - 'docs/presentation/*.pptx'
      - 'docs/presentation/*.docx'
      - 'tools/validate_presentation.py'
      - '.github/workflows/presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install document renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer fonts-noto-cjk poppler-utils
          python -m pip install --disable-pip-version-check Pillow
      - name: Validate packages and render PDFs
        run: python tools/validate_presentation.py
      - name: Keep compatibility render as a check artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentation-compatibility-check
          path: |
            docs/presentation/previews
            docs/presentation/*.pdf
            docs/presentation/validation.json
          retention-days: 14
